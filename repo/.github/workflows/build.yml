name: Build and Heal
on: push
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore.jks

      - name: Build
        run: if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt; else echo "Nada que compilar."; fi
      - name: Build signed release
        if: success()
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: app/build/outputs/apk/debug/*.apk, if-no-files-found: warn }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build_log.txt, if-no-files-found: ignore }
  suggest-fix:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}', fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: build-log }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - id: heal
        run: |
          python3 .github/scripts/self_heal.py build_log.txt || true
          if [ -s fixes_applied.txt ]; then echo "healed=true" >> $GITHUB_OUTPUT; else echo "healed=false" >> $GITHUB_OUTPUT; fi
      - if: steps.heal.outputs.healed == 'true'
        run: |
          git config user.name "factory-engine-bot"
          git config user.email "bot@factory-engine.local"
          git add -A
          git commit -m "Self-Healing: reparacion automatica aplicada"
          git push origin main
      - if: steps.heal.outputs.healed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build_log.txt', 'utf8').slice(-3500);
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: "Build fallido: revision manual requerida", body: "El motor de auto-reparacion no encontro regla conocida.\n\n```\n"+log+"\n```"});
