name: VECTOR-FORGE Android Release Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'repo/**'

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify gradlew exists
        working-directory: repo
        run: ls -la gradlew
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > repo/release.keystore
      - name: Build release APK (app module only)
        working-directory: repo
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-forge-release-apk
          path: repo/app/build/outputs/apk/release/*.apk
