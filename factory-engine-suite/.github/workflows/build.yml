name: Build and Heal

permissions:
  contents: write
  issues: write
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs: { failed: "${{ steps.build.outcome == 'failure' }}" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - id: build
        continue-on-error: true
        run: |
          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then gradle assembleDebug 2>&1 | tee build_log.txt
          elif [ -f "package.json" ]; then npm ci && npm run build 2>&1 | tee build_log.txt
          else echo "Nada que compilar todavía." | tee build_log.txt; fi
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore

      - if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build_log.txt }
  suggest-fix:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download build log
        uses: actions/download-artifact@v4
        with:
          name: build-log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run self-healing engine
        id: heal
        run: |
          python3 .github/scripts/self_heal.py build_log.txt || echo "healed=false" >> $GITHUB_OUTPUT
          if [ -s fixes_applied.txt ]; then
            echo "healed=true" >> $GITHUB_OUTPUT
          else
            echo "healed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push fix
        if: steps.heal.outputs.healed == 'true'
        run: |
          git config user.name "factory-engine-bot"
          git config user.email "bot@factory-engine.local"
          git add -A
          git commit -m "Self-Healing: reparacion automatica aplicada tras fallo de build"
          git push origin main

      - name: Open issue if no fix found
        if: steps.heal.outputs.healed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build_log.txt', 'utf8').slice(-3000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Build fallido: se requiere revision manual",
              body: "El motor de auto-reparacion no encontro una regla conocida para este error.\n\n```\n" + log + "\n```"
            });
