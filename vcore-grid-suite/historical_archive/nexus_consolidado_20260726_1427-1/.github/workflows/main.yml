name: V-Core Nexux Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          echo "$KEYSTORE_FILE" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4
      - name: Build signed Release APK
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEYSTORE_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Locate APK
        run: |
          find app/build/outputs/apk/release -type f -name "*.apk" -print
      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Generate SHA256
        run: |
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          sha256sum "$APK" | tee app-release-sha256.txt
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vcore-nexux-release-signed
          path: app/build/outputs/apk/release/*.apk

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: vcore-nexux-release-sha256
          path: app-release-sha256.txt
          
