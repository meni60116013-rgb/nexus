name: VCORE GRID SUITE - CI/CD Master Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Grant Execution Permissions
      run: chmod +x scripts/build-all.sh

    - name: Run Master Build and Audit Pipeline
      run: ./scripts/build-all.sh
